site_name: Metashape Expert Manual
site_description: >-
  An expert-level companion to the Agisoft Metashape user manual, distilling
  insights from the Agisoft community forums, the metashape-scripts
  repository, and field experience that go beyond what the official manuals
  cover.
site_author: Metashape Expert Manual contributors
site_url: https://photogrammetrycommunity.github.io/metashape-expert-manual/

# Repository
repo_name: PhotogrammetryCommunity/metashape-expert-manual
repo_url: https://github.com/PhotogrammetryCommunity/metashape-expert-manual
edit_uri: edit/main/docs/

copyright: >-
  Content licensed CC-BY-4.0. Code samples licensed under the MIT License.
  Forum quotations belong to their respective authors and are reproduced
  with attribution under fair-use technical commentary.

# ────────────────────────────────────────────────────────────────────────
# Theme — Material for MkDocs
# ────────────────────────────────────────────────────────────────────────
theme:
  name: material
  language: en
  custom_dir: overrides
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link        # link GUI / Python tabs across articles
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# ────────────────────────────────────────────────────────────────────────
# Plugins
# ────────────────────────────────────────────────────────────────────────
plugins:
  - search
  - mermaid2
  # mike provides the version selector at runtime; no extra plugin needed.

# ────────────────────────────────────────────────────────────────────────
# Hooks — render article metadata as a visible info block at the top
# of each article (per deep-review feedback that pure YAML
# frontmatter loses reader-visibility).
# ────────────────────────────────────────────────────────────────────────
hooks:
  - hooks/render_metadata.py

# ────────────────────────────────────────────────────────────────────────
# Custom stylesheets — hide the default `.md-status` nav icon (which
# Material adds for any article with a `status:` frontmatter field;
# the status is already rendered as a visible bullet via the hook
# above, so the nav icon is redundant).
# ────────────────────────────────────────────────────────────────────────
extra_css:
  - stylesheets/extra.css

# ────────────────────────────────────────────────────────────────────────
# Markdown extensions
# ────────────────────────────────────────────────────────────────────────
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - docs
        - .
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.tabbed:
      alternate_style: true   # required for content.tabs.link
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.keys

