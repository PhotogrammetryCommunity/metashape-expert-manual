# ────────────────────────────────────────────────────────────────────────
# Validation — fail the build on broken internal links / unrecognized nav
# ────────────────────────────────────────────────────────────────────────
strict: true

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
