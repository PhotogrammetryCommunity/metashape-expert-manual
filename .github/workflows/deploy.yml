name: Deploy docs to GitHub Pages

# Builds the MkDocs site under --strict and publishes it to GitHub Pages
# on every push to main. Requires the repository's Pages source to be set
# to "GitHub Actions" (Settings → Pages → Build and deployment → Source).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token scopes needed to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history: gen_changelog.py builds the list from git log

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Create venv and install dependencies
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -r requirements.txt

      - name: Content checks (changelog + archived citations)
        run: |
          ./.venv/bin/python scripts/gen_changelog.py --check
          ./.venv/bin/python scripts/add_archive_links.py --all --check

      - name: Build site (strict)
        run: ./.venv/bin/mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
