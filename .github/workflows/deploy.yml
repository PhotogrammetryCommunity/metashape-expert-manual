name: Deploy docs to GitHub Pages

# Builds the MkDocs site under --strict and publishes it to GitHub Pages
# on every push to main. Requires the repository's Pages source to be set
# to "GitHub Actions" (Settings → Pages → Build and deployment → Source).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token scopes needed to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Content checks (changelog + archived citations)
        run: |
          python scripts/gen_changelog.py --check
          python scripts/add_archive_links.py --all --check

      - name: Build site (strict)
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
